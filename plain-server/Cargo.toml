[package]
name = "plain-server"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "Shared Plain GraphQL, HTTP and native transport adapters"

[features]
"default" = ["core", "http_transport", "media"]
"media" = ["plain-rs/runtime-media"]
"http_transport" = ["plain-libs/http-client", "plain-libs/https", "tokio/net", "tokio/rt", "tokio/sync", "tokio/time", "plain-rs/tls"]
"core" = ["plain-libs/sqlite", "plain-libs/auth", "plain-libs/websocket", "plain-libs/multipart", "plain-libs/time", "dep:plain-graphql", "plain-libs/http-client", "dep:futures-util", "tokio/net", "tokio/rt-multi-thread", "tokio/sync", "tokio/time", "tokio/fs", "tokio/macros", "dep:subtle", "plain-rs/runtime"]


[dependencies]
plain-libs = { path = "../plain-libs", default-features = false }
"subtle" = { "version" = "2", "optional" = true }
"futures-util" = { "version" = "0.3", "default-features" = false, "features" = ["sink", "std"], "optional" = true }
"serde" = { "version" = "1", "features" = ["derive"] }
"sha2" = "0.10"
"log" = "0.4"
"tokio" = { "version" = "1", "default-features" = false, "features" = ["io-util"] }
plain-graphql = { path = "../plain-graphql", optional = true }
"plain-rs" = { "path" = "../plain-rs", "default-features" = false }

[dev-dependencies]
plain-libs = { path = "../plain-libs", default-features = false, features = ["image", "zip"] }
rand_core = { version = "=0.6.4", features = ["getrandom"] }
"rustls" = { "version" = "0.23", "default-features" = false, "features" = ["ring", "std"] }
"socket2" = { "version" = "0.6", "features" = ["all"] }
# Test-only: exposes plain-rs mdns packet-capture test seams, which
# `#[cfg(test)]` in plain-rs cannot reach from this crate's test binary.
"plain-rs" = { "path" = "../plain-rs", "default-features" = false, "features" = ["test-seams"] }
"tokio" = { "version" = "1", "features" = ["full", "test-util"] }

[target.'cfg(target_os = "linux")'.dependencies]
plain-rs = { path = "../plain-rs", default-features = false, features = ["linux-platform"] }

[[test]]
name = "screen_websocket"
path = "../tests/plain-server/screen_websocket.rs"

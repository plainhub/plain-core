name: Build and unit tests

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      release_smoke:
        description: Test Linux CLI installation and uninstallation on amd64 and arm64
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: rust-tests-${{ github.ref }}-${{ inputs.release_smoke && 'release' || 'standard' }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Build and test Rust workspace
    if: ${{ !inputs.release_smoke }}
    runs-on: ubuntu-26.04
    env:
      CC: gcc-14
      CXX: g++-14
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev python3

      - name: Setup Rust
        run: rustup toolchain install 1.99.0 --profile minimal

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Check the default CLI includes image inference
        run: |
          features=$(cargo tree --locked -p plainapp -e features -i plain-libs --prefix none)
          if ! grep -Fq 'plain-libs feature "image-search-inference"' <<< "$features"; then
            echo "Image search inference must be included in the default CLI build"
            exit 1
          fi

      - name: Compile all packages
        run: cargo build --workspace --locked

      - name: Run Rust unit tests
        run: cargo test --workspace --locked --no-fail-fast

      - name: Run CLI release script tests
        run: python3 -m unittest discover -s tests/unit/scripts -p 'test_*cli_release.py'

  release-smoke:
    name: CLI service ${{ matrix.arch }}
    if: ${{ inputs.release_smoke }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
          - arch: arm64
            target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev

      - name: Set up Rust
        shell: bash
        env:
          RUST_TARGET: ${{ matrix.target }}
        run: rustup toolchain install 1.99.0 --profile minimal --target "$RUST_TARGET"

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: cli-release-${{ matrix.target }}

      - name: Build the CLI with the committed Web UI
        run: cargo build --release --locked --target ${{ matrix.target }} -p plainapp

      - name: Verify Linux service install and uninstall
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          trap 'sudo systemctl status plainapp.service --no-pager || true; sudo journalctl -u plainapp.service --no-pager -n 60 || true' ERR
          binary="target/$TARGET/release/plainapp"
          "$binary" --version
          "$binary" --help
          test ! -e /usr/local/bin/plainapp
          test ! -e /var/lib/plainapp
          sudo install -m 0755 "$binary" /usr/local/bin/plainapp
          openssl rand -base64 32 | sudo plainapp passwd --stdin
          sudo plainapp install
          sudo systemctl enable --now plainapp.service
          curl -fsS --max-time 5 --retry 12 --retry-connrefused --retry-delay 1 http://127.0.0.1:8080/health
          sudo plainapp status
          sudo plainapp uninstall --keep-config --keep-data
          if systemctl is-active --quiet plainapp.service; then exit 1; fi
          test ! -e /etc/systemd/system/plainapp.service
          test ! -e /usr/local/bin/plainapp
          sudo test -f /var/lib/plainapp/prefs.json
          sudo test -f /var/lib/plainapp/plain.db

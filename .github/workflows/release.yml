name: Release

on:
  workflow_dispatch:
    inputs:
      verify_only:
        description: Build and verify provenance without scanning, drafting a release, or uploading to R2
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: plain-core-cli-release
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/build-cli-release.yml
    permissions:
      contents: read
      id-token: write
      attestations: write

  virustotal:
    if: ${{ !inputs.verify_only }}
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          pattern: plainapp-linux-*
          merge-multiple: true

      - name: Scan both release archives
        env:
          VT_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
        run: bash scripts/scan-cli-release.sh artifacts > virustotal.md

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: virustotal-report
          path: virustotal.md
          if-no-files-found: error

  release:
    name: Create GitHub Release draft
    needs: [build, virustotal]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          pattern: plainapp-linux-*
          merge-multiple: true

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-verification
          path: artifacts

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: virustotal-report
          path: artifacts

      - name: Sign release manifest
        shell: bash
        env:
          SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_PRIVATE_KEY }}
          PUBLIC_KEY: ${{ vars.RELEASE_SIGNING_PUBLIC_KEY }}
        run: |
          : "${SIGNING_KEY:?Configure RELEASE_SIGNING_PRIVATE_KEY}"
          : "${PUBLIC_KEY:?Configure RELEASE_SIGNING_PUBLIC_KEY}"
          grep -Fxq "RELEASE_PUBLIC_KEY='$PUBLIC_KEY'" install.sh
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("plain-cli/Cargo.toml", "rb"))["package"]["version"])')
          schema=$(sha256sum schema/database.sql | cut -d ' ' -f1)
          (cd artifacts && sha256sum --check --strict checksums.txt)
          { printf 'version %s\nschema %s\n' "$version" "$schema"; cat artifacts/checksums.txt; sha256sum install.sh; } > artifacts/release-manifest.txt
          key=$(mktemp)
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$SIGNING_KEY" > "$key"
          public=$(openssl pkey -in "$key" -pubout -outform DER | openssl base64 -A)
          test "$public" = "$PUBLIC_KEY"
          test "$(printf '%s' "$public" | openssl base64 -d -A | od -An -tx1 -N12 | tr -d ' \n')" = 302a300506032b6570032100
          openssl pkeyutl -sign -inkey "$key" -rawin -in artifacts/release-manifest.txt -out artifacts/release-manifest.sig
          test "$(wc -c < artifacts/release-manifest.sig)" -eq 64

      - name: Create draft with both Linux packages
        id: draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("plain-cli/Cargo.toml", "rb"))["package"]["version"])')
          tag="v$version"
          main_commit=$(git ls-remote --exit-code origin refs/heads/main | cut -f1)
          if [ "$main_commit" != "$GITHUB_SHA" ]; then
            echo "main advanced after this build. Run Release again from main." >&2
            exit 1
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists. Bump plain-cli/Cargo.toml before starting a new release." >&2
            exit 1
          fi
          refs=$(git ls-remote origin "refs/tags/$tag" "refs/tags/$tag^{}")
          if [ -n "$refs" ]; then
            tagged_commit=$(printf '%s\n' "$refs" | sort -k2 | tail -n1 | cut -f1)
            if [ "$tagged_commit" != "$GITHUB_SHA" ]; then
              echo "Tag $tag points to a different commit." >&2
              exit 1
            fi
          fi
          (cd artifacts && sha256sum --check checksums.txt)
          {
            cat <<'NOTES'
          ## Install

          ```sh
          curl -fsSL https://raw.githubusercontent.com/plainhub/plain-core/main/install.sh | bash
          ```

          The installer selects the Linux package and checks its release signature and checksum before installing it.

          NOTES
            cat <<'NOTES'
          ## What's Changed

          ### Improvements

          ### Fixes

          ## Security

          NOTES
            cat artifacts/virustotal.md
            cat <<'NOTES'

          ### Build provenance
          GitHub signed the build provenance for both Linux archives. Download the archive and `release-provenance.jsonl`, then verify with the GitHub CLI:
          ```sh
          gh attestation verify plainapp-linux-amd64.tar.gz \
            --repo plainhub/plain-core \
            --signer-workflow plainhub/plain-core/.github/workflows/build-cli-release.yml \
          NOTES
            printf '%s\n' "  --source-digest $GITHUB_SHA \\" "  --signer-digest $GITHUB_SHA \\"
            cat <<'NOTES'
            --bundle release-provenance.jsonl
          ```
          Use `plainapp-linux-arm64.tar.gz` in the same command for ARM64.

          ## SHA-256 Checksums
          Run `sha256sum --check checksums.txt` in the directory containing both archives.
          The installer and `plainapp update` verify the Ed25519 signature in `release-manifest.sig` before checking the archive checksum.
          NOTES
          } > release-notes.md
          gh release create "$tag" --draft --target "$GITHUB_SHA" --title "PlainApp CLI $version" --notes-file release-notes.md \
            artifacts/plainapp-linux-amd64.tar.gz artifacts/plainapp-linux-arm64.tar.gz artifacts/checksums.txt artifacts/release-provenance.jsonl \
            artifacts/release-manifest.txt artifacts/release-manifest.sig install.sh
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"

      - name: Upload versioned assets to R2
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL_S3: ${{ vars.R2_ENDPOINT_URL }}
          AWS_DEFAULT_REGION: auto
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_PREFIX: ${{ vars.R2_PREFIX }}
          TAG: ${{ steps.draft.outputs.tag }}
        run: |
          : "${AWS_ACCESS_KEY_ID:?Configure R2_ACCESS_KEY_ID}"
          : "${AWS_SECRET_ACCESS_KEY:?Configure R2_SECRET_ACCESS_KEY}"
          : "${AWS_ENDPOINT_URL_S3:?Configure R2_ENDPOINT_URL}"
          : "${R2_BUCKET:?Configure R2_BUCKET}"
          dest="s3://$R2_BUCKET/${R2_PREFIX:+${R2_PREFIX%/}/}$TAG/"
          for file in artifacts/plainapp-linux-amd64.tar.gz artifacts/plainapp-linux-arm64.tar.gz install.sh \
            artifacts/checksums.txt artifacts/release-provenance.jsonl artifacts/release-manifest.txt artifacts/release-manifest.sig; do
            aws s3 cp "$file" "$dest" --cache-control "public, max-age=31536000, immutable"
          done

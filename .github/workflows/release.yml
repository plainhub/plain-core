name: Release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: plain-core-cli-release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  binary:
    name: plainapp ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
          - arch: arm64
            target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev python3

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.99.0
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: cli-release-${{ matrix.target }}

      - name: Build plainapp with the committed Web UI
        run: cargo build --release --locked --target ${{ matrix.target }} -p plainapp

      - name: Verify and package
        env:
          TARGET: ${{ matrix.target }}
          ARCH: ${{ matrix.arch }}
        run: |
          plain="target/$TARGET/release/plainapp"
          archive="plainapp-linux-$ARCH.tar.gz"
          tar -czf "$archive" -C "$(dirname "$plain")" plainapp
          test "$(tar -tzf "$archive")" = plainapp
          unpacked=$(mktemp -d)
          tar -xzf "$archive" -C "$unpacked"
          cmp "$plain" "$unpacked/plainapp"
          "$unpacked/plainapp" --version
          "$unpacked/plainapp" --help

      - uses: actions/upload-artifact@v4
        with:
          name: plainapp-linux-${{ matrix.arch }}
          path: plainapp-linux-${{ matrix.arch }}.tar.gz
          if-no-files-found: error

  hashes:
    needs: binary
    runs-on: ubuntu-24.04
    permissions: {}
    outputs:
      subjects: ${{ steps.hashes.outputs.subjects }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: plainapp-linux-*
          merge-multiple: true

      - name: Hash both release archives
        id: hashes
        working-directory: artifacts
        run: |
          sha256sum plainapp-linux-amd64.tar.gz plainapp-linux-arm64.tar.gz > checksums.txt
          echo "subjects=$(base64 -w0 checksums.txt)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: release-checksums
          path: artifacts/checksums.txt
          if-no-files-found: error

  provenance:
    needs: hashes
    permissions:
      actions: read
      contents: write
      id-token: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: ${{ needs.hashes.outputs.subjects }}
      upload-assets: false

  virustotal:
    needs: binary
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: plainapp-linux-*
          merge-multiple: true

      - name: Scan both release archives
        env:
          VT_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
        run: bash scripts/scan-cli-release.sh artifacts > virustotal.md

      - uses: actions/upload-artifact@v4
        with:
          name: virustotal-report
          path: virustotal.md
          if-no-files-found: error

  release:
    name: Create GitHub Release draft
    needs: [hashes, provenance, virustotal]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: plainapp-linux-*
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          name: release-checksums
          path: artifacts

      - uses: actions/download-artifact@v4
        with:
          name: virustotal-report
          path: artifacts

      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.provenance.outputs.provenance-name }}
          path: artifacts

      - name: Create draft with both Linux packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROVENANCE_NAME: ${{ needs.provenance.outputs.provenance-name }}
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("plain-cli/Cargo.toml", "rb"))["package"]["version"])')
          tag="v$version"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists. Bump plain-cli/Cargo.toml before starting a new release." >&2
            exit 1
          fi
          refs=$(git ls-remote origin "refs/tags/$tag" "refs/tags/$tag^{}")
          if [ -n "$refs" ]; then
            tagged_commit=$(printf '%s\n' "$refs" | sort -k2 | tail -n1 | cut -f1)
            if [ "$tagged_commit" != "$GITHUB_SHA" ]; then
              echo "Tag $tag points to a different commit." >&2
              exit 1
            fi
          fi
          (cd artifacts && sha256sum --check checksums.txt)
          {
            cat <<'NOTES'
          ## What's Changed

          ### Improvements

          ### Fixes

          ## Security

          NOTES
            cat artifacts/virustotal.md
            cat <<'NOTES'

          ### SLSA Provenance (Level 3)
          The `.intoto.jsonl` file is a signed SLSA provenance document covering all release archives.
          Verify with [slsa-verifier](https://github.com/slsa-framework/slsa-verifier):
          ```sh
          slsa-verifier verify-artifact plainapp-linux-amd64.tar.gz \
          NOTES
            printf '%s\n' "  --provenance-path $PROVENANCE_NAME \\" "  --source-uri github.com/$GITHUB_REPOSITORY"
            cat <<'NOTES'
          ```

          ## SHA-256 Checksums
          Run `sha256sum --check checksums.txt` in the directory containing both archives.
          NOTES
          } > release-notes.md
          gh release create "$tag" --draft --target "$GITHUB_SHA" --title "PlainApp CLI $version" --notes-file release-notes.md \
            artifacts/plainapp-linux-amd64.tar.gz artifacts/plainapp-linux-arm64.tar.gz artifacts/checksums.txt "artifacts/$PROVENANCE_NAME"

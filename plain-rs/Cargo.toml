[package]
name = "plain-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "Shared Plain protocol, crypto, persistence and domain primitives"

[features]
"kv" = ["dep:rusqlite", "dep:serde_json", "dep:anyhow"]
"default" = ["crypto"]
"crypto" = ["dep:chacha20poly1305", "dep:p256", "dep:ed25519-dalek"]
"ble" = ["dep:anyhow"]
"ble-native" = ["ble", "chat", "dep:serde_json", "dep:jni"]
"mdns" = ["dep:socket2"]
"tls" = ["dep:rcgen", "dep:der", "dep:pkcs12", "dep:pkcs5", "dep:pkcs8", "dep:x509-parser", "dep:cbc", "dep:des", "dep:rc2", "dep:sha1", "dep:hmac", "dep:sha2_mac"]
"chat" = ["rusqlite/hooks", "crypto", "mdns", "events", "dep:chrono", "dep:anyhow", "dep:serde_json", "dep:rusqlite", "sqlite_browse", "tokio/sync", "tokio/rt", "tokio/fs", "tokio/time"]
"library" = ["dep:lofty", "kv", "dep:regex", "dep:rusqlite", "dep:chrono", "dep:anyhow", "prefs", "events", "tokio/rt", "tokio/fs", "tokio/time"]
"sqlite_browse" = ["dep:rusqlite", "dep:serde_json", "dep:anyhow"]
"prefs" = ["crypto", "dep:serde_json", "dep:anyhow"]
"trash" = ["filesystem", "storage-platform"]
"filesystem" = ["library", "dep:anyhow", "tokio/fs", "tokio/rt", "tokio/time", "tokio/sync"]
"events" = ["tokio/sync"]
"services" = ["link-preview", "http-client", "chat", "library", "events", "dep:hmac", "dep:sha2_mac"]
"graphql" = ["dep:async-graphql"]
"html" = ["dep:regex"]
"phone" = ["dep:regex", "dep:flate2", "dep:serde_json"]
"link-preview" = ["chat", "dep:regex"]
"http-client" = ["dep:reqwest", "reqwest/rustls-tls", "tokio/net", "tokio/rt", "tokio/time"]

"feeds" = ["library", "html"]
# Exposes test-only seams (e.g. mdns host_responder packet-capture
# helpers, the tempdir registry) to dependent crates' test binaries,
# which `#[cfg(test)]` cannot reach.
"test-seams" = ["dep:tempfile"]

"storage-platform" = ["dep:anyhow", "dep:sysinfo"]
"unix-platform" = ["dep:anyhow"]
"linux-system" = ["dep:anyhow"]
"linux-platform" = ["linux-system", "prefs", "filesystem", "storage-platform", "unix-platform", "tokio/process", "tokio/macros", "tokio/io-util"]

"image-metadata" = ["library", "dep:image"]
"runtime" = ["ble", "graphql","services", "phone", "filesystem", "trash", "html", "feeds", "tls", "linux-system", "dep:parking_lot", "dep:futures-util", "dep:rustls", "dep:tokio-tungstenite", "tokio-tungstenite/rustls-tls-webpki-roots", "dep:zip", "dep:http", "dep:hyper", "dep:hyper-util", "dep:tokio-rustls", "dep:image", "dep:plain-inference", "dep:tempfile", "dep:sysinfo", "tokio/net", "tokio/rt-multi-thread", "tokio/fs", "tokio/sync", "tokio/time", "tokio/macros"]
"runtime-media" = ["runtime", "image-metadata", "dep:notify", "tokio/process"]

[dependencies]
"flate2" = { version = "1", optional = true }
"kamadak-exif" = "=0.6.1"
"sysinfo" = { version = "0.32", default-features = false, features = ["disk"], optional = true }
"tempfile" = { "version" = "3", "optional" = true }
"reqwest" = { version = "0.12", default-features = false, features = ["stream"], optional = true }
"chacha20poly1305" = { "version" = "0.10", "optional" = true }
"p256" = { "version" = "0.14", "default-features" = false, "features" = ["ecdh", "pkcs8", "std"], "optional" = true }
"ed25519-dalek" = { "version" = "2", "features" = ["rand_core"], "optional" = true }
"der" = { version = "0.8", features = ["std", "derive"], optional = true }
"pkcs12" = { version = "=0.2.0-pre.0", default-features = false, features = ["kdf"], optional = true }
"pkcs5" = { version = "0.8", features = ["alloc", "pbes2"], optional = true }
"pkcs8" = { version = "0.11", optional = true }
"x509-parser" = { version = "0.18", optional = true }
"cbc" = { version = "0.2", features = ["block-padding", "alloc"], optional = true }
"des" = { version = "0.9", optional = true }
"rc2" = { version = "0.9", optional = true }
"sha1" = { version = "0.11", optional = true }
"sha2" = "0.10"
"hmac" = { "version" = "0.13", "optional" = true }
"sha2_mac" = { "package" = "sha2", "version" = "0.11", "optional" = true }
"rand" = "0.8"
"uuid" = { "version" = "1", "features" = ["v4", "serde"] }
"log" = "0.4"
"socket2" = { "version" = "0.5", "optional" = true, "features" = ["all"] }
"serde" = { "version" = "1", "features" = ["derive"] }
"serde_json" = { "version" = "1", "optional" = true }
"rusqlite" = { "version" = "0.41.1", "default-features" = false, "features" = ["bundled", "backup", "cache"], "optional" = true }
"anyhow" = { "version" = "1", "optional" = true }
"chrono" = { "version" = "0.4", "features" = ["serde"], "optional" = true }
"rcgen" = { "version" = "0.13", "default-features" = false, "features" = ["pem", "ring"], "optional" = true }
"lofty" = { "version" = "0.22", "optional" = true }
"libc" = "0.2"
"bytes" = "1"
"futures-core" = "0.3"
"async-graphql" = { "version" = "7", "default-features" = false, "optional" = true }
"regex" = { "version" = "1", "optional" = true }
"tokio" = { "version" = "1", "default-features" = false, "features" = ["io-util"] }

"parking_lot" = { "version" = "0.12", "optional" = true }
"futures-util" = { "version" = "0.3", "default-features" = false, "features" = ["sink", "std"], "optional" = true }
"rustls" = { "version" = "0.23", "default-features" = false, "features" = ["ring", "std"], "optional" = true }
"tokio-tungstenite" = { "version" = "0.30", "default-features" = false, "features" = ["connect"], "optional" = true }
"zip" = { "version" = "9", "default-features" = false, "features" = ["deflate-flate2"], "optional" = true }
"http" = { "version" = "1", "optional" = true }
"hyper" = { "version" = "1", "features" = ["client", "http1"], "optional" = true }
"hyper-util" = { "version" = "0.1", "features" = ["tokio"], "optional" = true }
"tokio-rustls" = { "version" = "0.26", "default-features" = false, "features" = ["ring"], "optional" = true }
"image" = { "version" = "0.25", "default-features" = false, "features" = ["jpeg", "png", "webp", "gif"], "optional" = true }
"notify" = { "version" = "7", "optional" = true }
"plain-inference" = { "path" = "../plain-inference", "optional" = true }

[dev-dependencies]
"plain-inference" = { "path" = "../plain-inference", "features" = ["test-seams"] }
"axum" = { "version" = "0.7", "default-features" = false, "features" = ["ws", "multipart", "json", "query", "tokio", "http1"] }
"axum-server" = { "version" = "0.7", "features" = ["tls-rustls-no-provider"] }
"serde_json" = "1"
"tokio" = { "version" = "1", "features" = ["full", "test-util"] }
"tempfile" = "3"

[target.'cfg(target_os = "android")'.dependencies]
jni = { "version" = "0.22", "optional" = true }

[[example]]
name = "discover_probe"
required-features = ["mdns"]

[[example]]
name = "ble_uuids"
required-features = ["ble"]

[target.'cfg(not(target_os = "ios"))'.dependencies]
sysinfo = { version = "0.32", default-features = false, features = ["system"], optional = true }

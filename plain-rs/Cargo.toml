[package]
name = "plain-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "Shared Plain protocol, crypto, persistence and domain primitives"

[features]
"kv" = ["dep:rusqlite", "dep:serde_json", "dep:anyhow", "plain-libs/kv"]
"default" = ["crypto"]
"crypto" = ["plain-libs/crypto"]
"ble" = ["dep:anyhow"]
"ble-native" = ["ble", "chat", "dep:serde_json", "dep:jni"]
"mdns" = ["dep:socket2"]
"tls" = ["plain-libs/tls"]
"chat" = ["rusqlite/hooks", "crypto", "mdns", "events", "dep:chrono", "dep:anyhow", "dep:serde_json", "dep:rusqlite", "sqlite_browse", "tokio/sync", "tokio/rt", "tokio/fs", "tokio/time", "plain-libs/time", "plain-libs/sqlite", "plain-libs/file-walk", "plain-libs/kv"]
"library" = ["kv", "dep:regex", "dep:rusqlite", "dep:chrono", "dep:anyhow", "prefs", "events", "tokio/rt", "tokio/fs", "tokio/time", "plain-libs/time", "plain-libs/media", "plain-libs/sqlite", "plain-libs/file-walk", "plain-libs/volumes"]
"sqlite_browse" = ["dep:rusqlite", "dep:serde_json", "dep:anyhow", "plain-libs/sqlite"]
"prefs" = ["crypto", "dep:serde_json", "dep:anyhow"]
"trash" = ["filesystem", "storage-platform"]
"filesystem" = ["library", "dep:anyhow", "tokio/fs", "tokio/rt", "tokio/time", "tokio/sync", "plain-libs/filesystem", "plain-libs/file-walk"]
"events" = ["tokio/sync"]
"services" = ["link-preview", "http-client", "chat", "library", "events", "dep:hmac", "dep:sha2_mac"]
"graphql" = ["dep:plain-graphql"]
"html" = ["dep:regex", "plain-libs/html"]
"phone" = ["dep:regex", "dep:serde_json", "plain-libs/phone"]
"link-preview" = ["chat", "dep:regex"]
"http-client" = ["dep:reqwest", "plain-libs/http-client", "tokio/net", "tokio/rt", "tokio/time"]

"feeds" = ["library", "html"]
# Exposes test-only seams (e.g. mdns host_responder packet-capture
# helpers, the tempdir registry) to dependent crates' test binaries,
# which `#[cfg(test)]` cannot reach.
"test-seams" = ["dep:tempfile", "plain-libs/test-seams"]

"storage-platform" = ["dep:anyhow", "plain-libs/disk-metrics", "plain-libs/system-metrics", "plain-libs/storage-platform", "plain-libs/volumes"]
"unix-platform" = ["dep:anyhow", "plain-libs/unix-platform"]
"linux-system" = ["dep:anyhow"]
"linux-platform" = ["linux-system", "filesystem", "storage-platform", "unix-platform", "tokio/process", "tokio/macros", "tokio/io-util", "plain-libs/linux-platform"]

"image-metadata" = ["library", "dep:image"]
"runtime" = ["dep:undoc", "ble", "graphql", "services", "phone", "trash", "feeds", "tls", "linux-system", "dep:parking_lot", "dep:futures-util", "dep:rustls", "dep:tokio-tungstenite", "tokio-tungstenite/__rustls-tls", "dep:zip", "dep:http", "dep:hyper", "dep:hyper-util", "dep:tokio-rustls", "dep:image", "ai-image-search", "dep:tempfile", "plain-libs/disk-metrics", "plain-libs/system-metrics", "tokio/net", "tokio/rt-multi-thread", "tokio/fs", "tokio/sync", "tokio/time", "tokio/macros", "plain-libs/apk", "plain-libs/dlna", "plain-libs/phone-batch", "plain-libs/watch", "dep:objc2", "dep:objc2-foundation", "dep:objc2-av-foundation", "dep:objc2-core-foundation", "dep:objc2-core-media", "dep:objc2-core-video", "dep:block2", "dep:dispatch2", "dep:windows"]
"runtime-media" = ["runtime", "media", "plain-libs/native-watch", "tokio/process"]

"ai-image-search" = ["plain-libs/ai-image-search"]
"media" = ["image-metadata", "dep:tempfile", "plain-libs/thumbnails"]

[dependencies]
undoc = { path = "../plain-libs/codecs/undoc", optional = true }
plain-libs = { path = "../plain-libs", default-features = false }
"tempfile" = { "version" = "3", "optional" = true }
"reqwest" = { version = "0.12", default-features = false, features = ["stream"], optional = true }
"sha2" = "0.10"
"hmac" = { "version" = "0.13", "optional" = true }
"sha2_mac" = { "package" = "sha2", "version" = "0.11", "optional" = true }
"rand" = "=0.10.3"
"uuid" = { "version" = "1", "features" = ["v4", "serde"] }
"log" = "0.4"
"socket2" = { "version" = "0.6", "optional" = true, "features" = ["all"] }
"serde" = { "version" = "1", "features" = ["derive"] }
"serde_json" = { "version" = "1", "optional" = true }
"rusqlite" = { "version" = "0.41.1", "default-features" = false, "features" = ["bundled", "backup", "cache"], "optional" = true }
"anyhow" = { "version" = "1", "optional" = true }
"chrono" = { "version" = "0.4", "features" = ["serde"], "optional" = true }
"libc" = "0.2"
"bytes" = "1"
"futures-core" = "0.3"
plain-graphql = { path = "../plain-graphql", optional = true }
"regex" = { "version" = "1", "optional" = true }
"tokio" = { "version" = "1", "default-features" = false, "features" = ["io-util"] }

"parking_lot" = { "version" = "0.12", "optional" = true }
"futures-util" = { "version" = "0.3", "default-features" = false, "features" = ["sink", "std"], "optional" = true }
"rustls" = { "version" = "0.23", "default-features" = false, "features" = ["ring", "std"], "optional" = true }
"tokio-tungstenite" = { "version" = "0.30", "default-features" = false, "features" = ["connect"], "optional" = true }
"zip" = { "version" = "9", "default-features" = false, "features" = ["deflate-flate2"], "optional" = true }
"http" = { "version" = "1", "optional" = true }
"hyper" = { "version" = "1", "features" = ["client", "http1"], "optional" = true }
"hyper-util" = { "version" = "0.1", "features" = ["tokio"], "optional" = true }
"tokio-rustls" = { "version" = "0.26", "default-features" = false, "features" = ["ring"], "optional" = true }
"image" = { "version" = "0.25", "default-features" = false, "features" = ["jpeg", "png", "webp", "gif"], "optional" = true }


[dev-dependencies]
"chacha20poly1305" = { "version" = "0.10" }
"rcgen" = { "version" = "0.13", "default-features" = false, "features" = ["pem", "ring"] }
plain-libs = { path = "../plain-libs", default-features = false, features = ["test-seams", "https"] }
"axum" = { "version" = "0.7", "default-features" = false, "features" = ["multipart", "json", "query", "tokio", "http1"] }
"serde_json" = "1"
"tokio" = { "version" = "1", "features" = ["full", "test-util"] }
"tempfile" = "3"

[target.'cfg(target_os = "android")'.dependencies]
jni = { "version" = "0.22", "optional" = true }

[[example]]
name = "discover_probe"
required-features = ["mdns"]

[[example]]
name = "ble_uuids"
required-features = ["ble"]

[target.'cfg(not(target_os = "ios"))'.dependencies]

[[example]]
name = "image_search"
required-features = ["ai-image-search"]

[[example]]
name = "thumb_bench"
required-features = ["media"]

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
objc2 = { path = "../vendor/native/objc2", version = "=0.6.5", default-features = false, optional = true, features = ["std"] }
objc2-foundation = { path = "../vendor/native/objc2-foundation", version = "=0.3.2", default-features = false, optional = true, features = ["std", "NSArray", "NSDictionary", "NSError", "NSObject", "NSString", "NSURL", "NSValue"] }
objc2-av-foundation = { path = "../vendor/native/objc2-av-foundation", version = "=0.3.2", default-features = false, optional = true, features = ["std", "AVAsset", "AVAssetReader", "AVAssetReaderOutput", "AVAssetTrack", "AVAssetWriter", "AVAssetWriterInput", "AVMediaFormat", "AVVideoSettings", "block2", "objc2-core-foundation", "objc2-core-media", "objc2-core-video", "dispatch2"] }
objc2-core-foundation = { path = "../vendor/native/objc2-core-foundation", version = "=0.3.2", default-features = false, optional = true, features = ["std", "CFString"] }
objc2-core-media = { path = "../vendor/native/objc2-core-media", version = "=0.3.2", default-features = false, optional = true, features = ["std", "CMSampleBuffer", "CMTime", "CMFormatDescription"] }
objc2-core-video = { path = "../vendor/native/objc2-core-video", version = "=0.3.2", default-features = false, optional = true, features = ["std", "CVBuffer", "CVImageBuffer", "CVPixelBuffer"] }
block2 = { path = "../vendor/native/block2", version = "=0.6.2", default-features = false, optional = true, features = ["std"] }

dispatch2 = { path = "../vendor/native/dispatch2", version = "=0.3.1", default-features = false, optional = true, features = ["alloc", "objc2"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { path = "../vendor/native/windows", version = "=0.57.0", default-features = false, optional = true, features = ["Win32_Foundation", "Win32_Media_MediaFoundation", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant"] }

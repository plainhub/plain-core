[package]
name = "plain-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "Shared Plain protocol, crypto, persistence and domain primitives"

[features]
"kv" = ["plain-libs/kv"]
"default" = ["crypto"]
"crypto" = ["plain-libs/crypto"]
"ble" = []
"ble-native" = ["ble", "chat"]
"mdns" = ["dep:socket2"]
"tls" = ["plain-libs/tls"]
"chat" = ["plain-libs/sqlite", "crypto", "mdns", "events", "plain-libs/time", "sqlite_browse", "tokio/sync", "tokio/rt", "tokio/fs", "tokio/time", "plain-libs/file-walk", "plain-libs/kv"]
"library" = ["kv", "plain-libs/regex", "plain-libs/time", "prefs", "events", "tokio/rt", "tokio/fs", "tokio/time", "plain-libs/media", "plain-libs/sqlite", "plain-libs/file-walk", "plain-libs/volumes"]
"sqlite_browse" = ["plain-libs/sqlite"]
"prefs" = ["plain-libs/auth", "crypto"]
"trash" = ["filesystem", "storage-platform"]
"filesystem" = ["library", "tokio/fs", "tokio/rt", "tokio/time", "tokio/sync", "plain-libs/filesystem", "plain-libs/file-walk"]
"events" = ["tokio/sync"]
"services" = ["link-preview", "http-client", "chat", "library", "events", "dep:hmac", "dep:sha2_mac"]
"graphql" = ["dep:plain-graphql"]
"html" = ["plain-libs/html"]
"phone" = [ "plain-libs/phone"]
"link-preview" = ["chat", "plain-libs/regex"]
"http-client" = ["plain-libs/http-client", "tokio/net", "tokio/rt", "tokio/time"]

"feeds" = ["library", "html"]
# Exposes test-only seams (e.g. mdns host_responder packet-capture
# helpers, the tempdir registry) to dependent crates' test binaries,
# which `#[cfg(test)]` cannot reach.
"test-seams" = ["plain-libs/test-seams"]

"storage-platform" = ["plain-libs/disk-metrics", "plain-libs/system-metrics", "plain-libs/storage-platform", "plain-libs/volumes"]
"unix-platform" = ["plain-libs/unix-platform"]
"linux-system" = []
"linux-platform" = ["linux-system", "filesystem", "storage-platform", "unix-platform", "tokio/process", "tokio/macros", "tokio/io-util", "plain-libs/linux-platform"]

"image-metadata" = ["library", "plain-libs/image"]
"runtime" = ["plain-libs/websocket", "dep:undoc", "ble", "graphql", "services", "phone", "trash", "feeds", "tls", "linux-system", "dep:parking_lot", "dep:futures-util", "dep:rustls", "plain-libs/zip", "dep:tokio-rustls", "plain-libs/image", "ai-image-search", "plain-libs/disk-metrics", "plain-libs/system-metrics", "tokio/net", "tokio/rt-multi-thread", "tokio/fs", "tokio/sync", "tokio/time", "tokio/macros", "plain-libs/apk", "plain-libs/dlna", "plain-libs/phone-batch", "plain-libs/watch", "dep:objc2", "dep:objc2-foundation", "dep:objc2-av-foundation", "dep:objc2-core-foundation", "dep:objc2-core-media", "dep:objc2-core-video", "dep:block2", "dep:dispatch2", "plain-libs/windows-video"]
"runtime-media" = ["runtime", "media", "plain-libs/native-watch", "tokio/process"]

"ai-image-search" = ["plain-libs/ai-image-search"]
"media" = ["image-metadata", "plain-libs/thumbnails"]

[dependencies]
undoc = { path = "../plain-libs/codecs/undoc", optional = true }
plain-libs = { path = "../plain-libs", default-features = false }
"sha2" = "0.10"
"hmac" = { "version" = "0.13", "optional" = true }
"sha2_mac" = { "package" = "sha2", "version" = "0.11", "optional" = true }
"rand" = "=0.10.3"
"log" = "0.4"
"socket2" = { "version" = "0.6", "optional" = true, "features" = ["all"] }
"serde" = { "version" = "1", "features" = ["derive"] }
"libc" = "0.2"
"bytes" = "1"
"futures-core" = "0.3"
plain-graphql = { path = "../plain-graphql", optional = true }
"tokio" = { "version" = "1", "default-features" = false, "features" = ["io-util"] }

"parking_lot" = { "version" = "0.12", "optional" = true }
"futures-util" = { "version" = "0.3", "default-features" = false, "features" = ["sink", "std"], "optional" = true }
"rustls" = { "version" = "0.23", "default-features" = false, "features" = ["ring", "std"], "optional" = true }
"tokio-rustls" = { "version" = "0.26", "default-features" = false, "features" = ["ring"], "optional" = true }


[dev-dependencies]
"chacha20poly1305" = { "version" = "0.10" }
plain-libs = { path = "../plain-libs", default-features = false, features = ["test-seams", "https"] }
"tokio" = { "version" = "1", "features" = ["full", "test-util"] }

[[example]]
name = "discover_probe"
required-features = ["mdns"]

[[example]]
name = "ble_uuids"
required-features = ["ble"]

[target.'cfg(not(target_os = "ios"))'.dependencies]

[[example]]
name = "image_search"
required-features = ["ai-image-search"]

[[example]]
name = "thumb_bench"
required-features = ["media"]

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
objc2 = { path = "../vendor/native/objc2", version = "=0.6.5", default-features = false, optional = true, features = ["std"] }
objc2-foundation = { path = "../vendor/native/objc2-foundation", version = "=0.3.2", default-features = false, optional = true, features = ["std", "NSArray", "NSDictionary", "NSError", "NSObject", "NSString", "NSURL", "NSValue"] }
objc2-av-foundation = { path = "../vendor/native/objc2-av-foundation", version = "=0.3.2", default-features = false, optional = true, features = ["std", "AVAsset", "AVAssetReader", "AVAssetReaderOutput", "AVAssetTrack", "AVAssetWriter", "AVAssetWriterInput", "AVMediaFormat", "AVVideoSettings", "block2", "objc2-core-foundation", "objc2-core-media", "objc2-core-video", "dispatch2"] }
objc2-core-foundation = { path = "../vendor/native/objc2-core-foundation", version = "=0.3.2", default-features = false, optional = true, features = ["std", "CFString"] }
objc2-core-media = { path = "../vendor/native/objc2-core-media", version = "=0.3.2", default-features = false, optional = true, features = ["std", "CMSampleBuffer", "CMTime", "CMFormatDescription"] }
objc2-core-video = { path = "../vendor/native/objc2-core-video", version = "=0.3.2", default-features = false, optional = true, features = ["std", "CVBuffer", "CVImageBuffer", "CVPixelBuffer"] }
block2 = { path = "../vendor/native/block2", version = "=0.6.2", default-features = false, optional = true, features = ["std"] }

dispatch2 = { path = "../vendor/native/dispatch2", version = "=0.3.1", default-features = false, optional = true, features = ["alloc", "objc2"] }

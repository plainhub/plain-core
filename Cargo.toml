[workspace]
resolver = "3"
members = ["plain-libs", "plain-rs", "plain-server", "plain-cli"]

[profile.dev]
debug = "line-tables-only"
opt-level = 1
incremental = true

[profile.dev.package."*"]
debug = false
opt-level = 3

[profile.dev.package.plain-libs]
opt-level = 1
debug = "line-tables-only"

[profile.dev.package.plain-rs]
opt-level = 1
debug = "line-tables-only"

[profile.dev.package.plain-server]
debug = "line-tables-only"

[profile.dev.package.plainapp]
debug = "line-tables-only"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"

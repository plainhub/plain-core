[workspace]
resolver = "3"
exclude = ["vendor/native/objc2", "vendor/native/objc2-encode", "vendor/native/block2", "vendor/native/dispatch2", "vendor/native/objc2-foundation", "vendor/native/objc2-av-foundation", "vendor/native/objc2-core-foundation", "vendor/native/objc2-core-media", "vendor/native/objc2-core-video"]
members = ["plain-libs/codecs/undoc", "plain-libs", "plain-rs", "plain-server", "plain-cli", "plain-graphql", "plain-graphql/macros", "plain-libs/codecs/tiff", "plain-libs/codecs/heic-rs", "plain-libs/codecs/rav1d", "plain-libs/codecs/zerocopy-derive", "plain-libs/codecs/zerocopy"]

[profile.dev]
debug = "line-tables-only"
opt-level = 1
incremental = true

[profile.dev.package."*"]
debug = false
opt-level = 3

[profile.dev.package.plain-libs]
opt-level = 1
debug = "line-tables-only"

[profile.dev.package.plain-rs]
opt-level = 0
debug = "line-tables-only"

[profile.dev.package.plain-server]
opt-level = 0
debug = "line-tables-only"

[profile.dev.package.plainapp]
opt-level = 0
debug = "line-tables-only"

[profile.dev.package.plain-graphql-macros]
opt-level = 3
debug = false
incremental = false

[profile.dev.package.plain-graphql]
opt-level = 3
debug = false
incremental = false

[profile.dev.package.rav1d]
opt-level = 3
debug = false

[profile.dev.package.heic-rs]
opt-level = 3
debug = false

[profile.dev.package.tiff]
opt-level = 3
debug = false

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"

[patch.crates-io]
objc2 = { path = "vendor/native/objc2" }
objc2-encode = { path = "vendor/native/objc2-encode" }
block2 = { path = "vendor/native/block2" }
dispatch2 = { path = "vendor/native/dispatch2" }
objc2-foundation = { path = "vendor/native/objc2-foundation" }
objc2-av-foundation = { path = "vendor/native/objc2-av-foundation" }
objc2-core-foundation = { path = "vendor/native/objc2-core-foundation" }
objc2-core-media = { path = "vendor/native/objc2-core-media" }
objc2-core-video = { path = "vendor/native/objc2-core-video" }

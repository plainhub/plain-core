[workspace]
resolver = "3"
members = ["plain-libs", "plain-rs", "plain-server", "plain-cli", "plain-graphql", "plain-graphql/macros", "plain-libs/codecs/tiff", "plain-libs/codecs/heic-rs", "plain-libs/codecs/rav1d", "plain-libs/codecs/assert_matches", "plain-libs/codecs/atomig-macro", "plain-libs/codecs/atomig", "plain-libs/codecs/fax", "plain-libs/codecs/fax_derive", "plain-libs/codecs/strum", "plain-libs/codecs/strum_macros", "plain-libs/codecs/to_method", "plain-libs/codecs/zerocopy-derive", "plain-libs/codecs/zerocopy"]

[profile.dev]
debug = "line-tables-only"
opt-level = 1
incremental = true

[profile.dev.package."*"]
debug = false
opt-level = 3

[profile.dev.package.plain-libs]
opt-level = 1
debug = "line-tables-only"

[profile.dev.package.plain-rs]
opt-level = 1
debug = "line-tables-only"

[profile.dev.package.plain-server]
debug = "line-tables-only"

[profile.dev.package.plainapp]
debug = "line-tables-only"

[profile.dev.package.plain-graphql-macros]
opt-level = 3
debug = false
incremental = false

[profile.dev.package.plain-graphql]
opt-level = 3
debug = false
incremental = false

[profile.dev.package.rav1d]
opt-level = 3
debug = false

[profile.dev.package.heic-rs]
opt-level = 3
debug = false

[profile.dev.package.tiff]
opt-level = 3
debug = false

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"

[workspace]
resolver = "3"
members = ["plain-libs", "plain-rs", "plain-server", "plain-cli"]

# Light optimization for workspace code: the thumbnail engine's hot
# loops (progressive DC decode, box resample) live in plain-libs's media
# module and are 5-10x slower at opt-level 0 — dev instances must not
# look broken.
[profile.dev]
opt-level = 1
incremental = true

# Keep third-party deps (image, fast_image_resize, jpeg-*, tantivy, …) at
# max optimization even in dev builds — all heavy processing lives in
# these crates, so they need -O3 for acceptable performance.
[profile.dev.package."*"]
opt-level = 3

[profile.dev.package.plain-libs]
debug = "line-tables-only"

[profile.dev.package.plain-rs]
debug = "line-tables-only"

[profile.dev.package.plain-server]
debug = "line-tables-only"

[profile.dev.package.plainapp]
debug = "line-tables-only"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"

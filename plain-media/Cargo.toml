[package]
name = "plain-media"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "Shared Plain media scanning, indexing and thumbnails"

[features]
"default" = ["library"]
"library" = ["plain-rs/library"]
# Exposes test-only seams (e.g. paths::pin_test_data_dir) to dependent crates'
# test binaries, which `#[cfg(test)]` alone cannot reach.
"test-seams" = []

[dependencies]
"rand" = "0.8"
"uuid" = { "version" = "1", "features" = ["v4"] }
"log" = "0.4"
"serde" = { "version" = "1", "features" = ["derive"] }
"serde_json" = { "version" = "1" }
"anyhow" = { "version" = "1" }
"chrono" = { "version" = "0.4", "features" = ["serde"] }
"tantivy" = { "version" = "0.22" }
"image" = { "version" = "0.25", "default-features" = false, "features" = ["jpeg", "png", "webp", "gif"] }
"fast_image_resize" = { "version" = "5", "features" = ["rayon"] }
"jpeg-decoder" = { "version" = "0.3", "default-features" = true }
"rusty_h264-decoder" = { "version" = "=0.16.0", "default-features" = false, "features" = ["std"] }
"rusty_h264-common" = { "version" = "=0.16.0", "default-features" = false, "features" = ["std"] }
"notify" = { "version" = "7" }
"tempfile" = { "version" = "3" }
"sha1" = { "version" = "0.10" }
"parking_lot" = { "version" = "0.12" }
"libc" = "0.2"
"tokio" = { "version" = "1", "default-features" = false, "features" = ["rt", "process", "sync", "time", "fs", "macros", "io-util"] }
"plain-rs" = { "path" = "../plain-rs", default-features = false, "features" = ["crypto", "prefs", "library", "filesystem", "trash", "events", "test-seams", "storage-platform"] }

[dev-dependencies]
# Keep the exact thumbnail reference independent of CPU-specific SIMD rounding.
"jpeg-decoder" = { "version" = "0.3", "features" = ["platform_independent"] }
"tokio" = { "version" = "1", "features" = ["full"] }

[[example]]
name = "thumb_bench"

[package]
name = "tiff"
version = "0.11.3"
edition = "2021"
license = "MIT"
build = false
autotests = false
autobenches = false
autoexamples = false

[package.metadata.upstream]
repository = "https://github.com/image-rs/image-tiff"
revision = "e41159ce058bf193718b017599e2d7d53e9ccc92"
archive-sha256 = "b63feaf3343d35b6ca4d50483f94843803b0f51634937cc2ec519fc32232bc52"

[lib]
path = "src/lib.rs"
doctest = false

[features]
"default" = ["deflate", "fax", "jpeg", "lzw"]
"deflate" = ["dep:flate2"]
"fax" = ["dep:fax34"]
"jpeg" = ["dep:zune-jpeg"]
"lzw" = ["dep:weezl"]
"webp" = []
"zstd" = []

[dependencies]
"fax34" = { path = "../fax", package = "fax", optional = true }
"flate2" = { version = "=1.1.10", optional = true }
"half" = { version = "=2.7.1" }
"quick-error" = { version = "=2.0.1" }
"weezl" = { version = "=0.1.12", optional = true }
"zune-jpeg" = { version = "=0.5.15", optional = true }

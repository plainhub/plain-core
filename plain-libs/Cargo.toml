[package]
name = "plain-libs"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "Reusable cryptography, media, file, format and native components"

[features]
"http-runtime" = ["dep:thiserror", "dep:smallvec", "dep:async-trait", "dep:atomic-waker", "dep:form_urlencoded", "dep:futures-channel", "dep:futures-sink", "dep:futures-util", "dep:pin-project-lite", "dep:rustls-pki-types", "dep:slab", "dep:socket2", "dep:tokio-util", "dep:tower-layer", "dep:tower-service", "dep:tracing", "dep:percent-encoding", "dep:fnv", "dep:rustls", "dep:tokio-rustls", "dep:sha1", "tokio/net", "tokio/rt", "tokio/time", "tokio/macros", "tokio-rustls/tls12"]
"auth" = ["dep:opaque-ke", "dep:rand_core", "dep:hkdf", "dep:zeroize", "dep:wasm-bindgen", "dep:getrandom_auth"]
"kv" = ["sqlite"]
"volumes" = []
"file-walk" = []
"default" = ["crypto"]
"crypto" = ["dep:chacha20poly1305", "dep:p256", "dep:ed25519-dalek", "dep:pbkdf2"]
"tls" = ["dep:ring", "dep:x509-cert", "dep:der", "dep:pkcs12", "dep:pkcs5", "dep:pkcs8", "dep:cbc", "dep:des", "dep:rc2", "dep:sha1", "dep:hmac", "dep:sha2_mac"]
"time" = ["dep:num-traits", "dep:js-sys", "dep:wasm-bindgen"]
"sqlite" = ["dep:libsqlite3-sys", "dep:bitflags", "dep:smallvec", "time"]
"html" = []
"xml" = []
"regex" = []
"phone" = ["regex", "compression"]
"phone-batch" = ["phone", "tokio/rt"]
"media" = ["time", "encoding", "compression"]
"thumbnails" = ["dep:heic-rs", "dep:rav1d", "media", "crypto", "image", "tokio/rt", "tokio/process", "tokio/time", "tokio/fs", "tokio/macros", "tokio/io-util", "dep:thiserror"]
"filesystem" = ["time", "tokio/fs", "tokio/rt", "tokio/time"]
"watch" = ["filesystem", "tokio/net"]
"apk" = ["zip"]
"https" = ["http-runtime", "tokio/sync"]
"multipart" = ["http-runtime"]
"websocket" = ["http-runtime"]
"dlna" = ["http-client"]
"http-client" = ["http-runtime", "dep:url", "dep:webpki-roots"]
"unix-platform" = []
"storage-platform" = ["volumes"]
"linux-platform" = ["storage-platform"]
"ai-image-search" = ["image", "dep:cc", "regex", "dep:thiserror", "dep:smallvec"]
"test-seams" = []
"document-nfc" = ["dep:smallvec"]
"compound-file" = ["dep:fnv"]

"peg" = []

"native-watch" = ["dep:bitflags", "dep:mio", "dep:windows-sys"]

"disk-metrics" = []

"system-metrics" = []
"windows-video" = ["media"]

"image" = ["dep:num-traits", "dep:bitflags", "compression"]
"zip" = ["compression"]

"compression" = ["dep:cfg-if"]
"encoding" = ["dep:cfg-if"]

[dependencies]
serde_core = { version = "=1.0.229", default-features = false, features = ["std"] }
async-trait = { version = "=0.1.92", optional = true }
atomic-waker = { version = "=1.1.2", optional = true }
form_urlencoded = { version = "=1.2.2", optional = true }
futures-channel = { version = "=0.3.34", optional = true }
futures-sink = { version = "=0.3.34", optional = true }
futures-util = { version = "=0.3.34", default-features = false, features = ["std", "sink"], optional = true }
libsqlite3-sys = { version = "=0.39.1", default-features = false, features = ["bundled", "min_sqlite_version_3_45_3"], optional = true }
pin-project-lite = { version = "=0.2.17", optional = true }
rustls-pki-types = { version = "=1.15.1", optional = true }
slab = { version = "=0.4.12", optional = true }
socket2 = { version = "=0.6.5", features = ["all"], optional = true }
tokio-util = { version = "=0.7.19", features = ["codec", "io"], optional = true }
tower-layer = { version = "=0.3.3", optional = true }
tower-service = { version = "=0.3.3", optional = true }
tracing = { version = "=0.1.44", default-features = false, features = ["std"], optional = true }

cfg-if = { version = "=1.0.5", optional = true }
num-traits = { version = "=0.2.19", optional = true }
bitflags = { version = "=2.13.2", optional = true }

opaque-ke = { version = "=4.1.0-pre.2", default-features = false, features = ["ristretto255", "argon2"], optional = true }
rand_core = { version = "=0.6.4", features = ["getrandom"], optional = true }
hkdf = { version = "=0.12.4", optional = true }
zeroize = { version = "1.9", optional = true }
"fnv" = { version = "=1.0.7", optional = true }
"tokio-rustls" = { version = "0.26", default-features = false, optional = true }
"bytes" = "1"
"futures-core" = "0.3"
"libc" = "0.2"
"log" = "0.4"
"serde" = { "version" = "1", "features" = ["derive"] }
"sha2" = "0.10"
"pbkdf2" = { version = "=0.13.0", default-features = false, features = ["sha2"], optional = true }
"tokio" = { "version" = "1", "default-features" = false, "features" = ["io-util", "sync"] }
"chacha20poly1305" = { "version" = "0.10", "optional" = true }
"p256" = { "version" = "0.14", "default-features" = false, "features" = ["ecdh", "pkcs8", "std"], "optional" = true }
"ed25519-dalek" = { "version" = "2", "optional" = true }
"ring" = { version = "=0.17.14", optional = true }
"x509-cert" = { version = "=0.3.0", default-features = false, optional = true }
"der" = { version = "0.8", features = ["std", "derive"], optional = true }
"pkcs12" = { version = "=0.2.0-pre.0", default-features = false, features = ["kdf"], optional = true }
"pkcs5" = { version = "0.8", features = ["alloc", "pbes2"], optional = true }
"pkcs8" = { version = "0.11", optional = true }
"cbc" = { version = "0.2", features = ["block-padding", "alloc"], optional = true }
"des" = { version = "0.9", optional = true }
"rc2" = { version = "0.9", optional = true }
"sha1" = { version = "0.11", optional = true }
"hmac" = { "version" = "0.13", "optional" = true }
"sha2_mac" = { "package" = "sha2", "version" = "0.11", "optional" = true }
"rustls" = { version = "0.23", default-features = false, features = ["ring", "std"], optional = true }
"url" = { version = "=2.5.8", optional = true }
"percent-encoding" = { version = "=2.3.2", optional = true }
"webpki-roots" = { version = "=1.0.10", optional = true }

"heic-rs" = { path = "codecs/heic-rs", optional = true }
"rav1d" = { path = "codecs/rav1d", optional = true }

"thiserror" = { "version" = "=2.0.21", "optional" = true, "features" = [] }
"smallvec" = { "version" = "=1.16.2", "features" = ["const_new", "const_generics"], "optional" = true }

[build-dependencies]
"cc" = { version = "1", optional = true }

[dev-dependencies]
"tokio" = { version = "1", features = ["full", "test-util"] }

[target."cfg(any(target_os=\"freebsd\", target_os=\"openbsd\", target_os = \"netbsd\", target_os = \"dragonfly\", target_os = \"ios\"))".dependencies]
"mio" = { "version" = "=1.2.4", "features" = ["os-ext"], "optional" = true }

[target."cfg(any(target_os=\"linux\", target_os=\"android\"))".dependencies]
"mio" = { "version" = "=1.2.4", "features" = ["os-ext"], "optional" = true }


[target."cfg(windows)".dependencies]
"windows-sys" = { "version" = "=0.52.0", "features" = ["Win32_System_Threading", "Win32_Foundation", "Win32_Storage_FileSystem", "Win32_Security", "Win32_System_WindowsProgramming", "Win32_System_IO"], "optional" = true }


[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rand = "=0.10.3"
getrandom = "=0.4.3"

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = { version = "=0.3.106", optional = true }
wasm-bindgen = { version = "=0.2.129", optional = true }
getrandom_auth = { package = "getrandom", version = "=0.2.17", features = ["js"], optional = true }

[[test]]
name = "opaque"
path = "../tests/plain-libs/auth/opaque.rs"
required-features = ["auth"]

[[example]]
name = "opaque-wasm-harness"
path = "../tests/plain-libs/auth/harness.rs"
required-features = ["auth"]

[package]
name = "plain-libs"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "Reusable cryptography, media, file, format and native components"

[features]
"kv" = ["sqlite", "dep:serde_json", "dep:anyhow"]
"volumes" = ["dep:anyhow"]
"file-walk" = ["dep:anyhow"]
"default" = ["crypto"]
"crypto" = ["dep:chacha20poly1305", "dep:p256", "dep:ed25519-dalek", "dep:pbkdf2"]
"tls" = ["dep:ring", "dep:x509-cert", "dep:der", "dep:pkcs12", "dep:pkcs5", "dep:pkcs8", "dep:cbc", "dep:des", "dep:rc2", "dep:sha1", "dep:hmac", "dep:sha2_mac"]
"time" = ["dep:chrono", "dep:core-foundation-sys"]
"sqlite" = ["time", "dep:rusqlite"]
"html" = []
"regex" = ["dep:regex-automata", "dep:regex-syntax"]
"phone" = ["regex", "dep:flate2", "dep:serde_json"]
"phone-batch" = ["phone", "tokio/rt"]
"media" = ["time", "dep:anyhow", "dep:encoding_rs", "dep:flate2"]
"thumbnails" = ["dep:tiff", "dep:heic-rs", "dep:rav1d", "media", "crypto", "dep:image", "dep:jpeg-decoder", "dep:rusty_h264-decoder", "dep:rusty_h264-common", "tokio/rt", "tokio/process", "tokio/time", "tokio/fs", "tokio/macros", "tokio/io-util", "dep:thiserror"]
"filesystem" = ["time", "tokio/fs", "tokio/rt", "tokio/time"]
"watch" = ["filesystem", "tokio/net"]
"apk" = ["dep:anyhow", "dep:zip"]
"https" = ["dep:axum", "axum/tokio", "dep:hyper-util", "hyper-util/server-auto", "hyper-util/service", "dep:tokio-rustls", "tokio/net", "tokio/rt", "tokio/sync", "tokio/macros", "tokio/time"]
"multipart" = ["dep:axum", "dep:http", "dep:httparse", "dep:memchr", "dep:mime"]
"websocket" = ["dep:axum", "dep:hyper", "dep:hyper-util", "dep:tokio-tungstenite", "tokio/rt"]
"dlna" = ["http-client"]
"http-client" = ["dep:reqwest", "reqwest/rustls-tls-webpki-roots-no-provider", "dep:rustls"]
"unix-platform" = ["dep:anyhow"]
"storage-platform" = ["volumes"]
"linux-platform" = ["storage-platform", "dep:serde_json"]
"ai-image-search" = ["dep:image", "dep:serde_json", "dep:cc", "dep:aho-corasick", "regex", "regex-automata/dfa", "regex-automata/nfa", "regex-automata/perf", "dep:thiserror", "dep:smallvec"]
"test-seams" = []
"document-nfc" = ["dep:smallvec"]
"compound-file" = ["dep:fnv"]

"peg" = ["dep:memchr"]

"native-watch" = ["dep:bitflags", "dep:mio", "dep:windows-sys"]

"disk-metrics" = ["dep:core-foundation-sys"]

"system-metrics" = []
"windows-video" = ["media"]

[dependencies]
"fnv" = { version = "=1.0.7", optional = true }
"axum" = { version = "0.7", default-features = false, optional = true }
"tokio-rustls" = { version = "0.26", default-features = false, optional = true }
"hyper" = { version = "1", optional = true }
"http" = { version = "=1.5.0", optional = true }
"httparse" = { version = "=1.10.1", optional = true }
"mime" = { version = "=0.3.17", optional = true }
"hyper-util" = { version = "0.1", features = ["tokio"], optional = true }
"tokio-tungstenite" = { version = "0.30", default-features = false, features = ["connect"], optional = true }
"bytes" = "1"
"futures-core" = "0.3"
"getrandom" = "=0.4.3"
"libc" = "0.2"
"log" = "0.4"
"rand" = "=0.10.3"
"serde" = { "version" = "1", "features" = ["derive"] }
"sha2" = "0.10"
"pbkdf2" = { version = "=0.13.0", default-features = false, features = ["sha2"], optional = true }
"tokio" = { "version" = "1", "default-features" = false, "features" = ["io-util", "sync"] }
"anyhow" = { "version" = "1", "optional" = true }
"chrono" = { "version" = "0.4", "default-features" = false, "features" = ["serde", "now", "oldtime", "wasmbind"], "optional" = true }
"rusqlite" = { "version" = "0.41.1", "default-features" = false, "features" = ["bundled", "backup", "cache"], "optional" = true }
"flate2" = { version = "1", optional = true }
"serde_json" = { "version" = "1", "optional" = true }
"encoding_rs" = { "version" = "=0.8.42", "optional" = true }
"image" = { "version" = "0.25", "default-features" = false, "features" = ["jpeg", "png", "webp", "gif"], "optional" = true }
"jpeg-decoder" = { version = "0.3", default-features = false, optional = true }
"rusty_h264-decoder" = { version = "=0.16.0", default-features = false, features = ["std"], optional = true }
"rusty_h264-common" = { version = "=0.16.0", default-features = false, features = ["std"], optional = true }
"chacha20poly1305" = { "version" = "0.10", "optional" = true }
"p256" = { "version" = "0.14", "default-features" = false, "features" = ["ecdh", "pkcs8", "std"], "optional" = true }
"ed25519-dalek" = { "version" = "2", "optional" = true }
"ring" = { version = "=0.17.14", optional = true }
"x509-cert" = { version = "=0.3.0", default-features = false, optional = true }
"der" = { version = "0.8", features = ["std", "derive"], optional = true }
"pkcs12" = { version = "=0.2.0-pre.0", default-features = false, features = ["kdf"], optional = true }
"pkcs5" = { version = "0.8", features = ["alloc", "pbes2"], optional = true }
"pkcs8" = { version = "0.11", optional = true }
"cbc" = { version = "0.2", features = ["block-padding", "alloc"], optional = true }
"des" = { version = "0.9", optional = true }
"rc2" = { version = "0.9", optional = true }
"sha1" = { version = "0.11", optional = true }
"hmac" = { "version" = "0.13", "optional" = true }
"sha2_mac" = { "package" = "sha2", "version" = "0.11", "optional" = true }
"zip" = { "version" = "9", "default-features" = false, "features" = ["deflate-flate2"], "optional" = true }
"rustls" = { version = "0.23", default-features = false, features = ["ring", "std"], optional = true }
"reqwest" = { version = "0.12", default-features = false, features = ["stream"], optional = true }

"tiff" = { path = "codecs/tiff", optional = true }
"heic-rs" = { path = "codecs/heic-rs", optional = true }
"rav1d" = { path = "codecs/rav1d", optional = true }

"aho-corasick" = { "version" = "=1.1.5", "optional" = true }
"regex-automata" = { version = "0.4", default-features = false, features = ["std", "syntax", "meta", "hybrid", "dfa-onepass", "nfa-backtrack", "perf-inline", "perf-literal", "unicode"], optional = true }
"regex-syntax" = { version = "0.8", default-features = false, features = ["std", "unicode"], optional = true }
"memchr" = { "version" = "=2.8.3", "optional" = true }
"thiserror" = { "version" = "=2.0.21", "optional" = true, "features" = [] }
"smallvec" = { "version" = "=1.16.2", "optional" = true }

[build-dependencies]
"cc" = { version = "1", optional = true }

[dev-dependencies]
"flate2" = "=1.1.10"
"weezl" = "=0.1.12"
"serde_json" = "1"
"tokio" = { version = "1", features = ["full", "test-util"] }
"jpeg-decoder" = { version = "0.3", default-features = false, features = ["platform_independent"] }

[target."cfg(any(target_os=\"freebsd\", target_os=\"openbsd\", target_os = \"netbsd\", target_os = \"dragonfly\", target_os = \"ios\"))".dependencies]
"mio" = { "version" = "=1.2.3", "features" = ["os-ext"], "optional" = true }

[target."cfg(any(target_os=\"linux\", target_os=\"android\"))".dependencies]
"mio" = { "version" = "=1.2.3", "features" = ["os-ext"], "optional" = true }

[target."cfg(target_os=\"macos\")".dependencies]
"bitflags" = { "version" = "=2.13.2", "optional" = true }

[target."cfg(windows)".dependencies]
"windows-sys" = { "version" = "=0.52.0", "features" = ["Win32_System_Threading", "Win32_Foundation", "Win32_Storage_FileSystem", "Win32_Security", "Win32_System_WindowsProgramming", "Win32_System_IO"], "optional" = true }

[target."cfg(any(target_os = \"macos\", target_os = \"ios\"))".dependencies]
"core-foundation-sys" = { "version" = "=0.8.7", "optional" = true }

[package]
name = "plain-graphql"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "GraphQL parsing, validation and execution for Plain"
license = "MIT OR Apache-2.0"

[dependencies]
plain-graphql-macros = { path = "macros" }
asynk-strim = { version = "=0.1.5" }
bytes = { version = "=1.12.1", features = ["serde"] }
futures-util = { version = "=0.3.34", default-features = false, features = ["std", "async-await"] }
indexmap = { version = "=2.14.2", features = ["serde"] }
rustc-hash = { version = "=2.1.3" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151" }
static_assertions_next = { version = "=1.1.2" }
pest = { version = "=2.9.3" }

[dev-dependencies]
tokio = { version = "=1.53.3", features = ["full", "test-util"] }
serde_json = "=1.0.151"

[package.metadata.upstream]
repository = "https://github.com/async-graphql/async-graphql"
revision = "73de5f9032a5ef7bacc181e97d54be763c5e7374"
